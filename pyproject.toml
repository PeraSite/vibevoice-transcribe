[project]
name = "pi-vibevoice-transcribe"
version = "0.1.0"
description = "A reusable Agent Skill for local, speaker-aware transcription with VibeVoice ASR on Apple Silicon"
readme = "README.md"
license = "MIT"
authors = [{ name = "PeraSite" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=0.34,<2",
    "jinja2>=3.1,<4",
    "mlx-audio==0.5.3",
]

[project.scripts]
pi-vibevoice-transcribe = "pi_vibevoice_transcribe:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"
