name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: brew install ffmpeg
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests
      - run: uv run --locked pi-vibevoice-transcribe --self-check
